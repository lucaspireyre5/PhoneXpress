    <linearGradient id="arc-right" x1="1690" y1="-40" x2="1230" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#347fff" stop-opacity="0"/>
      <stop offset=".25" stop-color="#477fff" stop-opacity=".7"/>
      <stop offset=".52" stop-color="#8ceaff"/>
      <stop offset=".77" stop-color="#2897ea" stop-opacity=".6"/>
      <stop offset="1" stop-color="#3a57ba" stop-opacity="0"/>
