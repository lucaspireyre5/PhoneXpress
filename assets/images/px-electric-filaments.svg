  <!-- Peripheral light spill; the centre stays transparent for copy. -->
  <g stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-halo)" opacity=".19">
    <use href="#left-spine" stroke="url(#arc-left)" stroke-width="18"/>
    <use href="#right-spine" stroke="url(#arc-right)" stroke-width="16"/>
    <use href="#bottom-spine" stroke="url(#arc-bottom)" stroke-width="13"/>
    <use href="#top-spine" stroke="url(#arc-top)" stroke-width="12"/>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round" filter="url(#halo)" opacity=".6">
    <use href="#left-spine" stroke="url(#arc-left)" stroke-width="3.1"/>
    <use href="#left-branches" stroke="url(#arc-left)" stroke-width="1.9"/>
    <use href="#right-spine" stroke="url(#arc-right)" stroke-width="3"/>
    <use href="#right-branches" stroke="url(#arc-right)" stroke-width="1.6"/>
    <use href="#bottom-spine" stroke="url(#arc-bottom)" stroke-width="2.5"/>
    <use href="#bottom-branches" stroke="url(#arc-bottom)" stroke-width="1.4"/>
    <use href="#top-spine" stroke="url(#arc-top)" stroke-width="2.1"/>
    <use href="#top-branches" stroke="url(#arc-top)" stroke-width="1.4"/>
  </g>
  <g stroke-linecap="round" stroke-linejoin="round">
    <use href="#left-spine" stroke="url(#arc-left)" stroke-width="1.25" opacity=".9"/>
    <use href="#left-branches" stroke="url(#arc-left)" stroke-width=".65" opacity=".67"/>
    <use href="#right-spine" stroke="url(#arc-right)" stroke-width="1.1" opacity=".86"/>
    <use href="#right-branches" stroke="url(#arc-right)" stroke-width=".65" opacity=".58"/>
    <use href="#bottom-spine" stroke="url(#arc-bottom)" stroke-width="1.05" opacity=".65"/>
    <use href="#bottom-branches" stroke="url(#arc-bottom)" stroke-width=".6" opacity=".44"/>
    <use href="#top-spine" stroke="url(#arc-top)" stroke-width=".9" opacity=".58"/>
    <use href="#top-branches" stroke="url(#arc-top)" stroke-width=".55" opacity=".4"/>
  </g>

  <!-- Small hot cores at a handful of junctions, with no animated flashes. -->
